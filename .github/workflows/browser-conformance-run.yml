name: Browser Conformance Run

# One OS leg of Browser Conformance. The caller decides which OS runs.
# Linux runs the full Rust test suite. macOS and Windows run clippy and the
# conformance runner. The nightly workflow runs the full suite on those OS.

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      os_name:
        description: Linux, macOS, or Windows. Used in the job name.
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: Clippy, tests and conformance (${{ inputs.os_name }})
    runs-on: ${{ inputs.runner }}
    # A cold Windows build compiles the whole Tauri stack twice (check and
    # test profiles), then the post-job cache save adds minutes.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xvfb

      # The runner starts with 16 GB of RAM and a 3 GB pagefile that Windows
      # grows on demand. Building the termul-manager test targets in parallel
      # commits up to about 34 GB, faster than the pagefile grows, and rustc
      # then fails with "The paging file is too small" (os error 1455).
      - name: Enlarge the pagefile
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 24GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # rust-embed embeds dist-web/ at build time, and the web::assets tests
      # assert on the embedded bundle.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features conformance -- -D warnings

      # Full suite on Linux only. macOS and Windows run this script in the
      # nightly workflow. The script builds with `--features conformance`, so
      # the Linux conformance step reuses those executables.
      - name: Cargo test
        if: runner.os == 'Linux'
        working-directory: src-tauri
        shell: bash
        run: bash ./tests/browser_conformance/run-rust-tests.sh

      # The full suite no longer runs on Windows, so build-windows-tests.ps1
      # does not run there. This builds only the conformance test, with the
      # same features and the default test profile as the next step, and puts
      # the Common-Controls v6 manifest beside that executable. Cargo then
      # reuses the executable, so the sidecar stays next to the exe that runs.
      - name: Install the Windows conformance manifest
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: ./tests/browser_conformance/build-windows-tests.ps1 --features conformance --test browser_conformance

      - name: Browser conformance
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        shell: bash
        env:
          TERMUL_BROWSER_CONFORMANCE: "1"
          TERMUL_BROWSER_CONFORMANCE_OUT: ${{ runner.temp }}/browser-conformance.json
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1600x1000x24" cargo test --features conformance --test browser_conformance -- --nocapture
          else
            cargo test --features conformance --test browser_conformance -- --nocapture
          fi

      - name: Upload conformance summary
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: browser-conformance-${{ runner.os }}
          path: ${{ runner.temp }}/browser-conformance.json
          if-no-files-found: warn
          retention-days: 14
