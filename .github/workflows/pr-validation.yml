name: PR Validation

on:
  pull_request:
    # ready_for_review is required. The two checks below are required on dev,
    # and they must start when a draft is marked ready, with no new push.
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, develop, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A description or title edit uses action `edited`. Code jobs skip that
  # action. Cancelling the in-progress run would abort the synchronize jobs
  # and leave them skipped.
  # A base-branch edit is also `edited`, but the merge commit changed.
  # Cancel the older run. The code jobs on this run still execute.
  # ready_for_review is not `edited`, so it cancels the in-progress draft run.
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  pr-title-check:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must not start with an uppercase letter.
            Use lowercase like: "feat: add new feature"

  pr-body-check:
    name: Validate PR Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Validate PR description against template
        id: validate
        env:
          # Pass the body via env, never interpolated into the shell, to avoid
          # command injection from attacker-controlled PR descriptions.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BODY_COMMENT_FILE: ${{ runner.temp }}/pr-body-comment.md
        run: bun run scripts/validate-pr-body.ts

      - name: Post or update failure comment
        # Skip on forked PRs: GITHUB_TOKEN is read-only there, so the comment
        # API calls would 403. Validation itself still gates forked PRs.
        if: failure() && steps.validate.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- pr-body-validation -->';
            const path = `${process.env.RUNNER_TEMP}/pr-body-comment.md`;
            let body;
            try {
              body = fs.readFileSync(path, 'utf8');
            } catch {
              body = `${marker}\n## ❌ PR description does not satisfy the template\n\nPlease fill in every required section of the PR template.`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Resolve failure comment on success
        # Skip on forked PRs (read-only GITHUB_TOKEN) to avoid a 403 turning a
        # passing validation into a failed job.
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- pr-body-validation -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              const body = `${marker}\n## ✅ PR description satisfies the template\n\nThanks for filling it in.`;
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }

  # Job-level filter. Do not add on.pull_request.paths to this workflow.
  # A skipped workflow leaves "Validate PR Title" and "Validate PR Description"
  # Pending, and those two checks are required on dev. A skipped job reports
  # success and does not block the pull request.
  changes:
    name: Detect Rust changes
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A change to this workflow must still run these jobs.
          # CodeQL rust stays in its analyze matrix. Skipping that upload
          # makes the CodeQL check fail with "1 configuration not found".
          # scripts/canvas and the pin are inputs of Rust Checks.
          # check-server-no-gui-libs.sh is an input of Standalone Server Build.
          # build:web inputs are not listed. Those jobs embed the bundle only.
          is_rust_relevant() {
            case "$1" in
              src-tauri|src-tauri/*) return 0 ;;
              .cargo|.cargo/*) return 0 ;;
              Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock) return 0 ;;
              rust-toolchain|*/rust-toolchain) return 0 ;;
              rust-toolchain.toml|*/rust-toolchain.toml) return 0 ;;
              rustfmt.toml|*/rustfmt.toml|clippy.toml|*/clippy.toml) return 0 ;;
              .github/workflows/pr-validation.yml) return 0 ;;
              canvas/figcraft.pin) return 0 ;;
              scripts/canvas|scripts/canvas/*) return 0 ;;
              scripts/check-server-no-gui-libs.sh) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Base SHA is missing or not 40 hex characters. Rust jobs run."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "Base commit ${BASE_SHA} is not in this checkout. Rust jobs run."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -z plus quotePath=false keeps names that Git would otherwise quote.
          # Read each NUL-terminated path from the stream. Do not store that
          # output in a shell variable.
          rust=false
          while IFS= read -r -d '' file; do
            [ -n "$file" ] || continue
            if is_rust_relevant "$file"; then
              echo "rust path: $file"
              rust=true
            fi
          done < <(git -c core.quotePath=false diff --name-only --no-renames -z "$BASE_SHA" HEAD)
          echo "Rust-relevant changes: $rust"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  validate:
    name: Lint, Typecheck & Test
    # Skip a description or title edit. A base-branch edit changes the merge
    # commit, so these jobs still run.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Rebrand check (no old product name)
        run: bun run rebrand --check

      - name: Biome (lint + format + imports)
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Shell tests (installer and Homebrew cask)
        run: bun run test:shell

  rust-checks:
    name: Rust Checks
    needs: changes
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    # Check, test and clippy run about 17 minutes on a warm cache, and the
    # post-job cache save adds about one more.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # Build the Vite web bundle BEFORE the Rust checks so rust-embed embeds a
      # non-empty dist-web/ — the web::assets tests then exercise the embedded-
      # serving OK-path (200 + correct Content-Type + caching), not just the
      # empty-embed 404 branch. (A missing dist-web/ would still compile green
      # in debug via allow_missing, but the OK-path assertions need the bundle.)
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      # The pin must name the same tag as the figcraft-mcp dependency (skips
      # with a message until src-tauri depends on it), and its bundle must
      # download and match the pinned sha256.
      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  web-build:
    name: Web Client Build
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

  standalone-server-build:
    name: Standalone Server Build
    needs: changes
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # Build the Vite web bundle BEFORE the cargo build so rust-embed embeds a
      # non-empty `dist-web/` (build sequencing). A release build with a missing
      # bundle fails clearly via the `web_embed_missing` compile_error in
      # assets.rs; this dev build compiles green regardless (allow_missing), but
      # the embedded bundle is exercised with real content.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      - name: Build troupe-server (native host)
        working-directory: src-tauri
        run: cargo build --bin troupe-server --features standalone-server

      - name: Clippy troupe-server (feature on)
        working-directory: src-tauri
        run: cargo clippy --bin troupe-server --features standalone-server -- -D warnings

      # The headless server must not link GTK/WebKit (#1349); it has to start on
      # hosts without them. Runs against the dev build above (rust-lld).
      - name: Assert troupe-server links no GUI libraries
        run: scripts/check-server-no-gui-libs.sh src-tauri/target/debug/troupe-server

  rust-windows-check:
    name: Rust Windows Smoke Check
    needs: changes
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    # A cold-cache run builds for up to about 18 min, and the post-job cache
    # save adds up to about 6 min. The budget covers both.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        shell: bash
        run: test -f dist-web/index.html && test -s dist-web/index.html

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Build troupe-server (Windows host)
        working-directory: src-tauri
        run: cargo build --bin troupe-server --features standalone-server

  build-check:
    name: Verify Tauri Frontend Build
    # !cancelled() replaces the default success() check. A path-skipped Rust
    # job must not skip this job. A failed Rust job still does.
    if: >-
      !cancelled() &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      needs.changes.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.web-build.result == 'success' &&
      (needs.rust-checks.result == 'success' || needs.rust-checks.result == 'skipped') &&
      (needs.rust-windows-check.result == 'success' || needs.rust-windows-check.result == 'skipped') &&
      (needs.standalone-server-build.result == 'success' || needs.standalone-server-build.result == 'skipped')
    needs: [changes, validate, rust-checks, rust-windows-check, web-build, standalone-server-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri frontend assets
        run: bun run build:frontend:tauri
