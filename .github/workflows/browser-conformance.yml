name: Browser Conformance

# Proves browser automation on each OS's real webview engine.
#
# Every OS that runs does clippy with warnings denied, then the conformance
# runner (`src-tauri/tests/browser_conformance`). Linux also runs the full
# Rust test suite. macOS and Windows run that suite in the nightly workflow.
# Capabilities that fail today are recorded per OS in
# `src-tauri/tests/browser_conformance/expected/`, and failing Rust tests
# in `known-test-failures/`. Any result that differs from those records
# fails the job.
#
# Draft pull requests run the Linux job only. macOS and Windows are separate
# jobs because a job `if` cannot read `matrix`. A skipped job reports
# success. They start when the pull request is not a draft, including on
# ready_for_review with no new push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop, dev]
    paths:
      - "src-tauri/**"
      - ".github/workflows/browser-conformance.yml"
      - ".github/workflows/browser-conformance-run.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-linux:
    name: Clippy, tests and conformance (Linux)
    uses: ./.github/workflows/browser-conformance-run.yml
    permissions:
      contents: read
    with:
      runner: ubuntu-22.04
      os_name: Linux

  conformance-macos:
    name: Clippy, tests and conformance (macOS)
    # workflow_call has no draft flag, so a caller still runs this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/browser-conformance-run.yml
    permissions:
      contents: read
    with:
      runner: macos-15
      os_name: macOS

  conformance-windows:
    name: Clippy, tests and conformance (Windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/browser-conformance-run.yml
    permissions:
      contents: read
    with:
      runner: windows-latest
      os_name: Windows
